[package]
name = "henosis-vault"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
bip39 = { version = "2.2", features = ["zeroize"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
fs2 = "0.4"
getrandom = "0.2"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.15"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
