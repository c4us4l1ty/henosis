[package]
name = "henosis-vault"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bip39 = { version = "2.2", features = ["zeroize"] }
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.8"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
