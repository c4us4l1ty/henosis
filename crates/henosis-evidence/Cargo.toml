[package]
name = "henosis-evidence"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
tempfile = "3.15"
