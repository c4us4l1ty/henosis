[package]
name = "henosis-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
henosis-akashi = { path = "../henosis-akashi" }
henosis-crux = { path = "../henosis-crux" }
henosis-dag = { path = "../henosis-dag" }
henosis-evidence = { path = "../henosis-evidence" }
henosis-leverage = { path = "../henosis-leverage" }
henosis-proxy = { path = "../henosis-proxy" }
henosis-vault = { path = "../henosis-vault" }
serde_json = "1.0"
shell-words = "1.1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.15"
