name: Desktop
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev
      # Bootstrap the new native dependency graph; removed after downloading lockfile.
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: desktop-lockfile
          path: Cargo.lock
      - run: cargo fmt -p henosis-desktop
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: desktop-formatted
          path: crates/henosis-desktop/src/*.rs
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p henosis-desktop --all-targets -- -D warnings
      - run: cargo build --locked -p henosis-desktop -p henosis-shell
