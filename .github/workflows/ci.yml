name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          cargo test --locked --workspace --no-run 2>&1 | tee /tmp/cargo_output.txt
          echo "CARGO_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV
          exit ${PIPESTATUS[0]}
        shell: bash
      - run: |
          sed 's/\x1b\[[0-9;]*m//g' /tmp/cargo_output.txt | grep -E 'error\[|mismatched|cannot borrow|cannot find|help:|note:|unused variable|unused import' | while IFS= read -r line; do
            echo "::error::${line}"
          done
        shell: bash
        if: always()
      - run: cargo test --locked --workspace
        shell: bash
        if: env.CARGO_EXIT_CODE == '0'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        shell: bash
        if: env.CARGO_EXIT_CODE == '0'
