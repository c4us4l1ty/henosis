name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: |
          cargo generate-lockfile
          i=0
          while IFS= read -r chunk; do
            printf "::notice title=CargoLock%03d::%s\n" "$i" "$chunk"
            i=$((i+1))
          done < <(base64 -w 0 Cargo.lock | fold -w 3000)
      - if: runner.os == 'Linux'
        run: cargo test --workspace --color never > ci-test.log 2>&1 || { echo "::error title=TestOutput::$(tail -c 2800 ci-test.log | base64 -w 0)"; exit 1; }
      - if: runner.os != 'Linux'
        run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
