name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile workspace tests
        shell: bash
        run: bash .github/scripts/check-rust.sh test --locked --workspace --no-run
      - name: Run workspace tests (fail on test errors)
        shell: bash
        run: bash .github/scripts/check-rust.sh test --locked --workspace
      # Existing workspace lint warnings are advisory. Compiler/lint errors
      # still fail the job; the desktop job additionally denies all warnings.
      - name: Check workspace lints
        shell: bash
        run: bash .github/scripts/check-rust.sh clippy --locked --workspace --all-targets
